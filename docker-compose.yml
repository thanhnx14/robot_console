version: '3.8'

services:
  # Tên dịch vụ, bạn có thể đặt tùy ý, ví dụ: 'app', 'console', ...
  robot_console:
    # Tự động build image từ Dockerfile trong thư mục hiện tại
    build: .
    
    # Đặt tên cho image sau khi build
    image: robot_console_dev_image:latest
    
    # Đặt tên cố định cho container (tương đương --name)
    container_name: robot_console
    
    # Tự động khởi động lại (tương đương --restart always)
    restart: always
    
    # Map cổng (tương đương -p)
    ports:
      - "9080:8081"
    networks:
      - shared_network
networks:
  shared_network:
    external: true